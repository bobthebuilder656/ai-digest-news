name: Daily AI Digest

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST daily (02:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate today's digest
        run: node fetch-digest.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit refreshed digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.nor
          git add digest.html digest.json glossary-history.json
          git diff --staged --quiet || git commit -m "Update d
          git push origin HEAD:main

      - name: Prepare Pages output
        run: |
          mkdir -p dist
          cp digest.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
