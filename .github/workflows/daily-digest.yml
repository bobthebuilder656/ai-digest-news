name: Daily AI Digest

on:
  schedule:
    # GitHub's free-tier scheduled workflows queue and run late, not at the
    # exact minute requested — verified over 15 consecutive days here, this
    # one consistently fired ~4h48m-5h39m (avg ~5h14m) after a 02:30 UTC
    # schedule. Scheduling 21:16 UTC (previous day) instead compensates for
    # that average delay so the real run lands close to 02:30 UTC / 08:00
    # IST. This is a best-effort compensation based on observed data, not a
    # guarantee — GitHub doesn't promise exact scheduled-run timing, so
    # re-check actual run times periodically (repo's Actions tab) and
    # adjust if the delay drifts.
    - cron: '16 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate today's digest
        run: node fetch-digest.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit refreshed digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.html digest.json glossary-history.json
          git diff --staged --quiet || git commit -m "Update digest"
          git push origin HEAD:main

      - name: Prepare Pages output
        run: |
          mkdir -p dist
          cp digest.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
